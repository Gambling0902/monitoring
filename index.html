<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Papan Portofolio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1631">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portofolio">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF2F8;
    --surface:#FFFFFF;
    --surface-2:#F2F5FB;
    --surface-alt:#E8EDF6;
    --border:#DFE6F1;
    --border-strong:#C0CCE2;
    --navy:#0A1631;
    --navy-2:#122544;
    --navy-3:#1D3A6E;
    --text:#0C1322;
    --muted:#66708A;
    --muted-2:#8A93AC;
    --gold:#B7791F;
    --gold-soft:#D9A13B;
    --gold-bg:#FBF1DC;
    --green:#0E9F6E;
    --green-bg:#E4F8F1;
    --green-strong:#067A54;
    --red:#E11D48;
    --red-bg:#FDE9EE;
    --red-strong:#AF0F30;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --radius-xl:22px;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-card:0 1px 2px rgba(10,22,49,.05), 0 12px 28px -16px rgba(10,22,49,.16);
    --shadow-hero:0 20px 44px -22px rgba(10,22,49,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background-color:var(--bg);
    background-image:
      linear-gradient(rgba(15,30,61,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,30,61,.04) 1px, transparent 1px);
    background-size:26px 26px;
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    font-size:16px;
  }
  ::selection{background:var(--gold-soft);color:#fff;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .wrap{max-width:960px;margin:0 auto;padding:0 0 60px;}
  .content{max-width:920px;margin:0 auto;padding:0 16px;}

  /* ===================== HERO / TERMINAL PANEL ===================== */
  .terminal-hero{
    background:
      radial-gradient(120% 140% at 15% -10%, rgba(217,161,59,.16), transparent 55%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 130%);
    border-radius:0 0 28px 28px;
    box-shadow:var(--shadow-hero);
    margin-bottom:26px;
    overflow:hidden;
  }

  .ticker-strip{
    position:relative;
    overflow:hidden;
    white-space:nowrap;
    border-bottom:1px solid rgba(255,255,255,.09);
    padding:10px 0;
    mask-image:linear-gradient(90deg,transparent,black 4%,black 96%,transparent);
  }
  .ticker-label{
    position:absolute;
    left:0;top:0;bottom:0;
    z-index:2;
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 14px 0 18px;
    background:linear-gradient(90deg, var(--navy) 58%, transparent);
    font-family:var(--font-mono);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.1em;
    color:#EAF0FF;
  }
  .ticker-track{
    display:inline-block;
    padding-left:60%;
    animation:scroll-left 26s linear infinite;
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:.02em;
  }
  .ticker-track span{margin-right:32px;color:#6E7EA3;}
  .ticker-track span b{color:#F3F6FC;font-weight:700;letter-spacing:.03em;}
  .t-up{color:#3EE0A0!important;}
  .t-down{color:#FF7B93!important;}
  @keyframes scroll-left{
    0%{transform:translateX(0);}
    100%{transform:translateX(-100%);}
  }

  .hero-body{padding:22px 20px 24px;}
  .hero-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  h1{
    font-family:var(--font-display);
    font-size:25px;
    font-weight:700;
    margin:0;
    letter-spacing:-.01em;
    color:#fff;
  }
  h1 .dot{color:var(--gold-soft);}
  .subtitle{color:#A6B3D2;font-size:13.5px;margin-top:7px;line-height:1.55;max-width:420px;}
  .live-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    color:#EAF0FF;
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:7px 12px;
    border-radius:20px;
    white-space:nowrap;
  }
  .pulse-dot{
    width:7px;height:7px;border-radius:50%;
    background:#3EE0A0;
    box-shadow:0 0 0 0 rgba(62,224,160,.55);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(62,224,160,.55);}
    70%{box-shadow:0 0 0 7px rgba(62,224,160,0);}
    100%{box-shadow:0 0 0 0 rgba(62,224,160,0);}
  }

  /* Hero stat bar — houses the required summary IDs */
  .hero-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 10px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,.1);
  }
  .stat-block{min-width:0;}
  .stat-block.wide{grid-column:1 / -1;padding-top:14px;border-top:1px dashed rgba(255,255,255,.14);}
  .summary-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:#8E9CC0;
    margin-bottom:6px;
    font-weight:700;
  }
  .summary-value{
    font-family:var(--font-mono);
    font-size:21px;
    font-weight:700;
    color:#fff;
    letter-spacing:-.01em;
  }
  .summary-sub{font-family:var(--font-mono);font-size:14px;margin-top:4px;font-weight:600;color:#B9C4DC;}
  .stat-block.wide .summary-value{font-size:30px;}
  .hero-stats .up{color:#3EE0A0;}
  .hero-stats .down{color:#FF7B93;}
  .hero-stats .flat{color:#B9C4DC;}
  .summary-value.up::before,.summary-sub.up::before{content:'▲ ';font-size:.68em;vertical-align:middle;}
  .summary-value.down::before,.summary-sub.down::before{content:'▼ ';font-size:.68em;vertical-align:middle;}

  @media (min-width:560px){
    .hero-stats{grid-template-columns:1fr 1fr 1fr;}
    .stat-block.wide{grid-column:auto;padding-top:0;border-top:none;border-left:1px dashed rgba(255,255,255,.14);padding-left:20px;}
  }

  /* ===================== SECTION LABELS ===================== */
  .section-eyebrow{
    display:flex;
    align-items:center;
    gap:9px;
    margin:0 0 12px;
    font-family:var(--font-display);
    font-size:12.5px;
    font-weight:700;
    color:var(--navy);
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .section-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none;}
  .section-eyebrow::after{content:'';flex:1;height:1px;background:var(--border-strong);}

  /* ===================== ADD CARD ===================== */
  .add-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-xl);
    padding:20px;
    margin-bottom:26px;
    box-shadow:var(--shadow-card);
  }
  .add-title{display:none;} /* replaced visually by .section-eyebrow above the card */
  .add-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  input{
    width:100%;
    background:var(--surface-2);
    border:1.5px solid var(--border);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:17px;
    padding:13px 12px;
    border-radius:var(--radius-sm);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus{border-color:var(--gold);background:#fff;}
  input::placeholder{color:var(--muted-2);}
  button{
    font-family:var(--font-body);
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:var(--radius-sm);
    padding:13px 16px;
    cursor:pointer;
    transition:filter .12s ease, transform .05s ease;
  }
  .btn-add{background:var(--navy);color:#fff;width:100%;letter-spacing:.01em;}
  .btn-add:hover{filter:brightness(1.15);}
  .btn-add:active{transform:scale(.99);}

  /* ===================== HOLDINGS ===================== */
  #holdingsList{display:flex;flex-direction:column;gap:13px;margin-bottom:16px;}

  .holding{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--border-strong);
    border-radius:var(--radius-lg);
    padding:17px 18px;
    box-shadow:var(--shadow-card);
    display:grid;
    grid-template-columns:1fr;
    grid-template-areas:"top" "delta" "grid" "stop";
    gap:13px;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .holding:has(.delta-box.up){border-left-color:var(--green);}
  .holding:has(.delta-box.down){border-left-color:var(--red);}
  .holding.stop-hit{border-color:var(--red);border-left-color:var(--red);box-shadow:0 0 0 3px var(--red-bg), var(--shadow-card);}

  .h-top{grid-area:top;display:flex;justify-content:space-between;align-items:flex-start;}
  .h-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    color:var(--navy);
    letter-spacing:-.01em;
  }
  .h-name::first-letter{
    background:var(--gold-bg);
    color:var(--gold);
    padding:2px 6px;
    border-radius:7px;
    margin-right:1px;
  }
  .h-lot{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:4px;}
  .del-btn{
    background:transparent;
    color:var(--muted);
    border:1.5px solid var(--border);
    padding:8px 12px;
    font-size:12px;
    font-weight:600;
    border-radius:var(--radius-sm);
    white-space:nowrap;
    flex:none;
  }
  .del-btn:hover{color:var(--red);border-color:var(--red);background:var(--red-bg);}

  .h-grid{grid-area:grid;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted-2);
    margin-bottom:5px;
    font-weight:700;
  }
  .field-value{font-family:var(--font-mono);font-size:15.5px;font-weight:700;color:var(--text);}
  .price-input{padding:10px 11px;font-size:15px;}

  .delta-box{
    grid-area:delta;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-radius:var(--radius-md);
    padding:14px 16px;
  }
  .delta-box.up{background:linear-gradient(120deg, var(--green-bg), #fff 130%);}
  .delta-box.down{background:linear-gradient(120deg, var(--red-bg), #fff 130%);}
  .delta-box.flat{background:var(--surface-alt);}
  .delta-pct{font-family:var(--font-mono);font-size:24px;font-weight:700;line-height:1.1;}
  .delta-pct.up::before{content:'▲ ';font-size:.62em;vertical-align:middle;}
  .delta-pct.down::before{content:'▼ ';font-size:.62em;vertical-align:middle;}
  .delta-rp{font-family:var(--font-mono);font-size:13.5px;font-weight:600;}
  .up{color:var(--green-strong);}
  .down{color:var(--red-strong);}
  .flat{color:var(--muted);}

  .stop-panel{
    grid-area:stop;
    border:1.5px dashed var(--border-strong);
    border-radius:var(--radius-md);
    padding:13px 15px;
    background:linear-gradient(180deg, rgba(183,121,31,.035), transparent 65%);
  }
  .stop-panel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
  .stop-panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .stop-tag{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.02em;
    padding:3px 9px;
    border-radius:20px;
    background:var(--gold-bg);
    color:var(--gold);
  }
  .stop-tag.manual{background:var(--navy);color:#fff;}
  .stop-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;}
  .stop-price{font-family:var(--font-mono);font-size:17px;font-weight:700;}
  .stop-alert{
    margin-top:11px;
    background:linear-gradient(120deg, var(--red), var(--red-strong));
    color:#fff;
    font-weight:700;
    font-size:13px;
    padding:10px 12px;
    border-radius:10px;
    text-align:center;
  }
  .mini-input{padding:9px 10px;font-size:14px;}
  .mini-label{font-size:10.5px;color:var(--muted);margin-bottom:4px;font-weight:600;}

  @media (min-width:640px){
    .holding{
      grid-template-columns:1fr 240px;
      grid-template-areas:
        "top   delta"
        "grid  grid"
        "stop  stop";
      gap:14px 18px;
    }
    .delta-box{flex-direction:column;align-items:flex-end;gap:4px;height:100%;justify-content:center;}
    .h-grid{grid-template-columns:1fr 1fr 1fr;}
    .add-grid{grid-template-columns:1.3fr 1fr 1fr auto;align-items:end;}
    .btn-add{width:auto;}
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    border:1.5px dashed var(--border-strong);
    border-radius:var(--radius-lg);
    font-size:14.5px;
    background:var(--surface);
  }
  .footnote{color:var(--muted);font-size:12px;text-align:center;margin-top:22px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">

  <div class="terminal-hero">
    <div class="ticker-strip">
      <div class="ticker-label"><span class="pulse-dot"></span>LIVE</div>
      <div class="ticker-track" id="tickerTrack"></div>
    </div>
    <div class="hero-body">
      <div class="hero-top">
        <div>
          <h1>Papan Portofolio<span class="dot">.</span></h1>
          <div class="subtitle">Monitoring saham IPO kamu, lengkap dengan trailing stop otomatis biar profit kejaga.</div>
        </div>
        <div class="live-badge"><span class="pulse-dot"></span>Real-time</div>
      </div>
      <div class="hero-stats">
        <div class="stat-block">
          <div class="summary-label">Total Modal</div>
          <div class="summary-value" id="sumModal">Rp 0</div>
        </div>
        <div class="stat-block">
          <div class="summary-label">Nilai Sekarang</div>
          <div class="summary-value" id="sumNow">Rp 0</div>
        </div>
        <div class="stat-block wide">
          <div class="summary-label">Untung / Rugi</div>
          <div class="summary-value" id="sumGain">Rp 0</div>
          <div class="summary-sub" id="sumGainPct">0.00%</div>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <p class="section-eyebrow">Tambah Saham</p>
    <div class="add-card">
      <div class="add-grid">
        <div>
          <label>Nama / Kode Saham</label>
          <input id="inName" type="text" placeholder="Contoh: BREN">
        </div>
        <div>
          <label>Jumlah Lot</label>
          <input id="inLot" type="number" min="0" step="1" placeholder="1" inputmode="numeric">
        </div>
        <div>
          <label>Harga Beli /lembar (Rp)</label>
          <input id="inBuy" type="number" min="0" step="1" placeholder="1000" inputmode="numeric">
        </div>
        <button class="btn-add" onclick="addStock()">+ Tambah Saham</button>
      </div>
    </div>

    <p class="section-eyebrow">Posisi Aktif</p>
    <div id="holdingsList"></div>
    <div id="emptyState" class="empty" style="display:none;">
      Belum ada saham. Tambahkan saham IPO pertamamu di atas.
    </div>

    <div class="footnote" id="saveStatus">Memuat data...</div>
  </div>
</div>

<script>
// GANTI URL DI BAWAH INI dengan URL Web App Apps Script kamu
const API_URL = 'https://script.google.com/macros/s/AKfycbyjHA-TuBwh9pe0yg08tXWFQQfF_SS4uUuOM_TqEHhlDOCiDQDcTbD0tmRt0I0GVVtsRQ/exec';

let stocks = [];

function formatRp(n){
  const sign = n < 0 ? '-' : '';
  n = Math.abs(Math.round(n));
  return sign + 'Rp ' + n.toLocaleString('id-ID');
}
function formatPct(n){
  const sign = n > 0 ? '+' : '';
  return sign + n.toFixed(2) + '%';
}

function setStatus(msg, isError){
  const el = document.getElementById('saveStatus');
  el.textContent = msg;
  el.style.color = isError ? 'var(--red)' : '';
}

// ==== ATURAN TRAILING STOP OTOMATIS ====
// Makin besar profit, makin ketat trailing stop-nya
function getAutoStopPct(profitPct){
  if(profitPct < 20) return 25;
  if(profitPct < 50) return 20;
  if(profitPct < 100) return 15;
  return 10;
}

function getStopInfo(s){
  const shares = s.lot * 100;
  const modalValue = shares * s.buy;
  const nowValue = shares * s.current;
  const profitPct = modalValue > 0 ? ((nowValue - modalValue) / modalValue) * 100 : 0;
  const highest = (s.highest && s.highest > s.current) ? s.highest : s.current;
  // Tier trailing stop dihitung dari profit TERTINGGI yang pernah dicapai (di harga puncak),
  // bukan dari profit sekarang - supaya begitu sempat profit besar, level stop tetap ketat
  // walau harga sudah mulai turun dari puncaknya.
  const peakProfitPct = s.buy > 0 ? ((highest - s.buy) / s.buy) * 100 : 0;
  const autoPct = getAutoStopPct(peakProfitPct);
  const hasManual = s.manualStopPct !== null && s.manualStopPct !== undefined && s.manualStopPct !== '';
  const usedPct = hasManual ? Number(s.manualStopPct) : autoPct;
  const stopPrice = highest * (1 - usedPct / 100);
  const hit = s.current <= stopPrice;
  return { profitPct, peakProfitPct, highest, autoPct, usedPct, isManual: hasManual, stopPrice, hit };
}

async function loadStocks(){
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    stocks = (data.stocks || []).map(s => ({
      ...s,
      highest: s.highest || s.current,
      manualStopPct: (s.manualStopPct === '' || s.manualStopPct === undefined) ? null : s.manualStopPct
    }));
    setStatus('Data tersimpan di Google Sheets kamu · harga sekarang & trailing stop diisi/diatur manual.', false);
  }catch(e){
    stocks = [];
    setStatus('Gagal konek ke database. Cek URL Apps Script sudah benar & sudah di-deploy.', true);
  }
  render();
}

async function callApi(payload){
  setStatus('Menyimpan...', false);
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!data.ok){
      setStatus('Gagal menyimpan: ' + (data.error || 'terjadi kesalahan'), true);
      return null;
    }
    setStatus('Tersimpan ✓ · aman untuk refresh atau tutup halaman.', false);
    return data;
  }catch(e){
    setStatus('Gagal konek ke database. Cek URL Apps Script & koneksi internet.', true);
    return null;
  }
}

async function addStock(){
  const nameEl = document.getElementById('inName');
  const lotEl = document.getElementById('inLot');
  const buyEl = document.getElementById('inBuy');

  const name = nameEl.value.trim().toUpperCase();
  const lot = parseFloat(lotEl.value);
  const buy = parseFloat(buyEl.value);

  if(!name || !lot || lot <= 0 || !buy || buy <= 0){
    alert('Isi nama saham, jumlah lot, dan harga beli dengan benar ya.');
    return;
  }

  const tempId = 'temp-' + Date.now();
  stocks.push({ id: tempId, name, lot, buy, current: buy, highest: buy, manualStopPct: null });
  render();

  nameEl.value = '';
  lotEl.value = '';
  buyEl.value = '';

  const result = await callApi({ action: 'add', name, lot, buy, current: buy });
  if(result && result.id){
    const s = stocks.find(x => x.id === tempId);
    if(s) s.id = result.id;
    render();
  }
}

async function updateCurrent(id, value){
  const s = stocks.find(x => x.id === id);
  if(!s) return;
  const v = parseFloat(value);
  if(isNaN(v)) return;
  s.current = v;
  if(v > (s.highest || 0)) s.highest = v;
  render();
  await callApi({ action: 'update', id, current: s.current });
}

async function setManualStop(id, value){
  const s = stocks.find(x => x.id === id);
  if(!s) return;
  const v = value.trim();
  s.manualStopPct = v === '' ? null : parseFloat(v);
  render();
  await callApi({ action: 'setStop', id, manualStopPct: v === '' ? '' : parseFloat(v) });
}

async function removeStock(id){
  stocks = stocks.filter(x => x.id !== id);
  render();
  await callApi({ action: 'delete', id });
}

function render(){
  const list = document.getElementById('holdingsList');
  const empty = document.getElementById('emptyState');
  list.innerHTML = '';

  if(stocks.length === 0){
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
  }

  let totalModal = 0, totalNow = 0;

  stocks.forEach(s => {
    const shares = s.lot * 100;
    const modalValue = shares * s.buy;
    const nowValue = shares * s.current;
    const gainRp = nowValue - modalValue;
    const gainPct = modalValue > 0 ? (gainRp / modalValue) * 100 : 0;

    totalModal += modalValue;
    totalNow += nowValue;

    const dir = gainRp > 0 ? 'up' : (gainRp < 0 ? 'down' : 'flat');
    const stopInfo = getStopInfo(s);

    const row = document.createElement('div');
    row.className = 'holding' + (stopInfo.hit ? ' stop-hit' : '');
    row.innerHTML = `
      <div class="h-top">
        <div>
          <div class="h-name">${s.name}</div>
          <div class="h-lot">${s.lot} lot &middot; ${shares.toLocaleString('id-ID')} lembar</div>
        </div>
        <button class="del-btn" onclick="removeStock('${s.id}')">Hapus</button>
      </div>
      <div class="h-grid">
        <div>
          <div class="field-label">Harga Beli</div>
          <div class="field-value">${formatRp(s.buy)}</div>
        </div>
        <div>
          <div class="field-label">Harga Sekarang</div>
          <input class="price-input" type="number" min="0" step="1" value="${s.current}" inputmode="numeric"
            onchange="updateCurrent('${s.id}', this.value)">
        </div>
        <div>
          <div class="field-label">Nilai Sekarang</div>
          <div class="field-value">${formatRp(nowValue)}</div>
        </div>
      </div>
      <div class="delta-box ${dir}">
        <div class="delta-pct ${dir}">${formatPct(gainPct)}</div>
        <div class="delta-rp ${dir}">${formatRp(gainRp)}</div>
      </div>
      <div class="stop-panel">
        <div class="stop-panel-top">
          <span class="stop-panel-title">Trailing Stop</span>
          <span class="stop-tag ${stopInfo.isManual ? 'manual' : ''}">${stopInfo.isManual ? 'Manual' : 'Otomatis'} · ${stopInfo.usedPct}%</span>
        </div>
        <div class="stop-row">
          <div>
            <div class="mini-label">Harga Tertinggi (profit puncak ${formatPct(stopInfo.peakProfitPct)})</div>
            <div class="field-value">${formatRp(stopInfo.highest)}</div>
          </div>
          <div>
            <div class="mini-label">Harga Stop (jual jika turun ke sini)</div>
            <div class="stop-price ${stopInfo.hit ? 'down' : ''}">${formatRp(stopInfo.stopPrice)}</div>
          </div>
        </div>
        <div class="stop-row" style="margin-top:10px;">
          <div>
            <div class="mini-label">Override manual % (kosongkan utk otomatis)</div>
            <input class="mini-input" type="number" min="1" max="90" step="1"
              placeholder="${stopInfo.autoPct}"
              value="${stopInfo.isManual ? stopInfo.usedPct : ''}"
              onchange="setManualStop('${s.id}', this.value)">
          </div>
        </div>
        ${stopInfo.hit ? '<div class="stop-alert">⚠️ HARGA SUDAH MENYENTUH TRAILING STOP — pertimbangkan jual</div>' : ''}
      </div>
    `;
    list.appendChild(row);
  });

  document.getElementById('sumModal').textContent = formatRp(totalModal);
  document.getElementById('sumNow').textContent = formatRp(totalNow);
  const totalGain = totalNow - totalModal;
  const totalGainPct = totalModal > 0 ? (totalGain / totalModal) * 100 : 0;
  const gainEl = document.getElementById('sumGain');
  const gainPctEl = document.getElementById('sumGainPct');
  gainEl.textContent = formatRp(totalGain);
  gainPctEl.textContent = formatPct(totalGainPct);
  const cls = totalGain > 0 ? 'up' : (totalGain < 0 ? 'down' : 'flat');
  gainEl.className = 'summary-value ' + cls;
  gainPctEl.className = 'summary-sub ' + cls;

  renderTicker();
}

function renderTicker(){
  const track = document.getElementById('tickerTrack');
  if(stocks.length === 0){
    track.innerHTML = '<span>Tambahkan saham untuk melihat ticker &middot; Papan Portofolio &middot; </span>';
    return;
  }
  let html = '';
  stocks.forEach(s => {
    const modalValue = s.lot * 100 * s.buy;
    const nowValue = s.lot * 100 * s.current;
    const pct = modalValue > 0 ? ((nowValue - modalValue) / modalValue) * 100 : 0;
    const cls = pct > 0 ? 't-up' : (pct < 0 ? 't-down' : '');
    const arrow = pct > 0 ? '▲' : (pct < 0 ? '▼' : '·');
    html += `<span><b>${s.name}</b> <span class="${cls}">${arrow} ${formatPct(pct)}</span></span>`;
  });
  track.innerHTML = html + html;
}

loadStocks();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
